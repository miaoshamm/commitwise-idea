name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (SemVer, e.g. 0.5.0)'
        required: true
        type: string
      skip_verifier:
        description: 'Skip Plugin Verifier (faster but less safe)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    # 仅在源仓库触发，避免 fork 误发布
    if: github.repository_owner == 'miaoshamm'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "::error::GitHub Secret 'PUBLISH_TOKEN' is missing. Generate a Personal Access Token at https://plugins.jetbrains.com/author/me/tokens and add it to the repository Secrets."
            exit 1
          fi
          if [[ -z "$CERTIFICATE_CHAIN" ]] || [[ -z "$PRIVATE_KEY" ]]; then
            echo "::error::GitHub Secrets 'CERTIFICATE_CHAIN' or 'PRIVATE_KEY' are missing. JetBrains Marketplace rejects unsigned plugins. Generate a certificate chain at Marketplace → your plugin → Signing → Generate certificate chain, then base64-encode and add as repository Secrets."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" = "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # 从 tag 名 v0.5.0 提取 0.5.0
            VERSION="${GITHUB_REF##*/v}"
          fi
          # 校验 SemVer
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: '$VERSION' (expected SemVer like 0.5.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Resolved plugin version: $VERSION (prerelease: $([[ "$VERSION" == *-* ]] && echo yes || echo no))"

      - name: Bump pluginVersion in gradle.properties
        run: |
          sed -i "s/^pluginVersion=.*/pluginVersion=${{ steps.version.outputs.version }}/" gradle.properties
          echo "Updated gradle.properties:"
          grep '^pluginVersion' gradle.properties

      - name: Build distribution
        run: ./gradlew buildPlugin --no-daemon -PuseLocalIde=false --stacktrace

      - name: Verify plugin compatibility
        if: ${{ github.event.inputs.skip_verifier != 'true' }}
        run: ./gradlew verifyPlugin --no-daemon -PuseLocalIde=false --stacktrace

      - name: Sign & Publish to JetBrains Marketplace
        id: publish
        run: ./gradlew publishPlugin --no-daemon -PuseLocalIde=false --stacktrace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: Locate distribution zip
        id: dist
        run: |
          ZIP_PATH=$(ls build/distributions/*.zip 2>/dev/null | head -1)
          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::No plugin zip found in build/distributions/"
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"
          echo "Distribution: $ZIP_PATH ($(du -h "$ZIP_PATH" | cut -f1))"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: commitwise-idea-${{ steps.version.outputs.version }}
          path: ${{ steps.dist.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## CommitWise ${{ steps.version.outputs.version }}

            IntelliJ IDEA plugin for AI-powered commit messages and code review.

            ### Install
            Download the `.zip` below and install via **IDE → Settings → Plugins → ⚙ → Install Plugin from Disk...**, or install directly from the [JetBrains Marketplace](https://plugins.jetbrains.com/plugin/${{ vars.MARKETPLACE_PLUGIN_ID || 'com.commitwise.idea' }}).

            See full changelog: [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          generate_release_notes: true
          files: ${{ steps.dist.outputs.zip_path }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
