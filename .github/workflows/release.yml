name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（SemVer，如 0.5.1）。留空则自动取 gradle.properties 并自动递增'
        required: false
        type: string
      skip_verifier:
        description: '跳过 Plugin Verifier（更快，但少一层兼容性校验）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    # 仅在源仓库触发，避免 fork 误发布
    if: github.repository_owner == 'miaoshamm'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "::error::GitHub Secret 'PUBLISH_TOKEN' is missing. Generate a Personal Access Token at https://plugins.jetbrains.com/author/me/tokens and add it to the repository Secrets."
            exit 1
          fi
          if [[ -z "$CERTIFICATE_CHAIN" ]] || [[ -z "$PRIVATE_KEY" ]]; then
            echo "::error::GitHub Secrets 'CERTIFICATE_CHAIN' or 'PRIVATE_KEY' are missing. JetBrains Marketplace rejects unsigned plugins. Generate a certificate chain at Marketplace → your plugin → Signing → Generate certificate chain, then base64-encode and add as repository Secrets."
            exit 1
          fi
          echo "All required secrets are present."

      # Secret 里既可以直接粘多行 PEM，也可以存 base64（更不容易在粘贴时被弄坏换行）。
      # 这里统一解码成 PEM 写进 GITHUB_ENV，供 signPlugin / publishPlugin 读取。
      - name: Prepare signing material
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          decode_pem() {
            local v="$1" decoded
            if [[ "$v" == *"-----BEGIN"* ]]; then
              printf '%s\n' "$v"
              return 0
            fi
            decoded="$(printf '%s' "$v" | base64 -d 2>/dev/null || true)"
            if [[ -n "$decoded" ]]; then
              printf '%s\n' "$decoded"
            else
              printf '%s\n' "$v"
            fi
          }
          CHAIN="$(decode_pem "$CERTIFICATE_CHAIN")"
          KEY="$(decode_pem "$PRIVATE_KEY")"
          if [[ "$CHAIN" != *"-----BEGIN CERTIFICATE"* ]]; then
            echo "::error::CERTIFICATE_CHAIN 不像 PEM 证书链（未找到 '-----BEGIN CERTIFICATE'），请检查 Secret 内容"
            exit 1
          fi
          if ! grep -qE -- "-----BEGIN .*PRIVATE KEY-----" <<<"$KEY"; then
            echo "::error::PRIVATE_KEY 不像 PEM 私钥（未找到 '-----BEGIN ... PRIVATE KEY-----'），请检查 Secret 内容"
            exit 1
          fi
          {
            echo "CERTIFICATE_CHAIN<<SIGNING_ENV_EOF_7f3a"
            printf '%s\n' "$CHAIN"
            echo "SIGNING_ENV_EOF_7f3a"
            echo "PRIVATE_KEY<<SIGNING_ENV_EOF_7f3a"
            printf '%s\n' "$KEY"
            echo "SIGNING_ENV_EOF_7f3a"
          } >> "$GITHUB_ENV"
          echo "签名材料已就绪（chain ${#CHAIN} 字符 / key ${#KEY} 字符）"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew scripts/*.sh

      # ---------- 版本号：候选 -> 自动递增到「线上未占用」 ----------
      - name: Resolve requested version
        id: requested
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE="tag ${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
            SOURCE="workflow_dispatch 输入"
          else
            VERSION="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r')"
            SOURCE="gradle.properties"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: '$VERSION' (expected SemVer like 0.5.0)"
            exit 1
          fi
          echo "requested=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "候选版本：$VERSION（来源：$SOURCE）"

      # Marketplace 同一版本号只能上传一次，重复上传会报
      # "The com.commitwise.idea plugin already contains version x.y.z in channel"。
      # 这里先查线上已发布版本，自动把候选版本递增到下一个空位。
      - name: Auto-increment version if already published
        id: version
        env:
          PLUGIN_XML_ID: com.commitwise.idea
        run: |
          set -euo pipefail
          REQUESTED="${{ steps.requested.outputs.requested }}"
          FINAL="$(bash scripts/plugin-version.sh next "$REQUESTED")"
          if ! [[ "$FINAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version resolution returned an invalid version: '$FINAL'"
            exit 1
          fi
          echo "version=$FINAL" >> "$GITHUB_OUTPUT"
          if [[ "$FINAL" != "$REQUESTED" ]]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::候选版本 ${REQUESTED} 在 Marketplace 上已存在，本次自动递增为 ${FINAL}"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "is_prerelease=$([[ "$FINAL" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "最终发布版本：$FINAL"
          {
            echo "### Plugin version"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Requested | \`$REQUESTED\` |"
            echo "| Will publish | \`$FINAL\` |"
            echo "| Auto-bumped | $([[ "$FINAL" != "$REQUESTED" ]] && echo yes || echo no) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply version to gradle.properties
        run: |
          sed -i "s/^pluginVersion=.*/pluginVersion=${{ steps.version.outputs.version }}/" gradle.properties
          grep '^pluginVersion' gradle.properties

      - name: Build distribution
        run: ./gradlew buildPlugin --no-daemon -PuseLocalIde=false --stacktrace

      - name: Verify plugin compatibility
        if: ${{ inputs.skip_verifier != 'true' }}
        run: ./gradlew verifyPlugin --no-daemon -PuseLocalIde=false --stacktrace

      # 兜底：即使线上版本列表查不到（插件未公开/接口异常），
      # 上传时撞到版本冲突也会自动 +1 重试，不会让 workflow 直接挂掉。
      - name: Sign & Publish to JetBrains Marketplace
        id: publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          MAX_ATTEMPTS: '4'
        run: bash scripts/publish-marketplace.sh

      - name: Locate distribution zip
        id: dist
        env:
          PUBLISHED_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_PATH=$(ls "build/distributions/"*"${PUBLISHED_VERSION}"*.zip 2>/dev/null | head -1 || true)
          if [[ -z "$ZIP_PATH" ]]; then
            ZIP_PATH=$(ls -t build/distributions/*.zip 2>/dev/null | head -1 || true)
          fi
          if [[ -z "$ZIP_PATH" ]]; then
            echo "::error::No plugin zip found in build/distributions/"
            exit 1
          fi
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"
          echo "Distribution: $ZIP_PATH ($(du -h "$ZIP_PATH" | cut -f1))"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: commitwise-idea-${{ steps.publish.outputs.version }}
          path: ${{ steps.dist.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CommitWise ${{ steps.publish.outputs.version }}
          body: |
            ## CommitWise ${{ steps.publish.outputs.version }}

            IntelliJ IDEA plugin for AI-powered commit messages and code review.

            | | |
            |---|---|
            | Published version | `${{ steps.publish.outputs.version }}` |
            | Tag | `${{ github.ref_name }}` |
            | Requested version | `${{ steps.requested.outputs.requested }}` |

            > Version numbers are generated automatically: if the requested version is already
            > taken on the JetBrains Marketplace, the patch number is bumped until a free slot is found.

            ### Install
            Download the `.zip` below and install via **IDE → Settings → Plugins → ⚙ → Install Plugin from Disk...**, or install directly from the [JetBrains Marketplace](https://plugins.jetbrains.com/plugin/${{ vars.MARKETPLACE_PLUGIN_ID || '35543-commitwise' }}).

            > The Marketplace page takes its numeric id plus slug (`35543-commitwise`). The plugin
            > `id` from `plugin.xml` (`com.commitwise.idea`) is *not* a valid URL path — it 404s.

            See full changelog: [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          generate_release_notes: true
          files: ${{ steps.dist.outputs.zip_path }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
