name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # 需要 write 才能创建/更新 GitHub Release（滚动预发布）
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build & Test
        run: |
          chmod +x gradlew
          # buildPlugin 生成 build/distributions/*.zip（插件分发包）；
          # 单跑 `build` 只会编译+测试+打 jar，不会产出插件 ZIP。
          ./gradlew buildPlugin test --no-daemon -PuseLocalIde=false --stacktrace

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: commitwise-idea-build-${{ github.run_number }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      # --- 自动发布到 GitHub Releases（仅 main 分支的 push，PR 不发布） ---
      # 策略：固定 tag `latest` 做滚动预发布，每次 main 构建覆盖更新同一份 Release，
      # 不会累积一堆历史 Release；标记 prerelease + make_latest=false，
      # 因此正式版（v* tag 由 release.yml 创建）仍然占据 Releases 页的 "Latest" 标识。
      - name: Read plugin version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: meta
        run: |
          VERSION=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Publish rolling build to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          body: |
            Rolling pre-release, rebuilt automatically from the latest commit on `main`.

            | | |
            |---|---|
            | Version | `${{ steps.meta.outputs.version }}` (from `gradle.properties`) |
            | Commit | [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |
            | Build | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            ### Install
            Download the `.zip` below, then in the IDE:
            **Settings → Plugins → ⚙ → Install Plugin from Disk...**

            > This is a development build from `main`, not a tagged release.
            > For stable versions, use the `v*` tags or the JetBrains Marketplace listing.
          files: build/distributions/*.zip
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
