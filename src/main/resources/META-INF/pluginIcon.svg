<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cw-bg" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDE3F8"/>
      <stop offset="1" stop-color="#C8D2F0"/>
    </linearGradient>
    <linearGradient id="cw-git" x1="8" y1="22" x2="18" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5763D"/>
      <stop offset="1" stop-color="#E44332"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#cw-bg)"/>

  <!-- 文档阴影 -->
  <path d="M 12.8 8 H 23.8 L 28.8 13 V 30 a 2 2 0 0 1 -2 2 H 12.8 a 2 2 0 0 1 -2 -2 V 10 a 2 2 0 0 1 2 -2 Z" fill="#5B6BA8" opacity="0.18"/>

  <!-- 文档主体 -->
  <path d="M 12 7 H 23 L 28 12 V 29 a 2 2 0 0 1 -2 2 H 12 a 2 2 0 0 1 -2 -2 V 9 a 2 2 0 0 1 2 -2 Z" fill="#FFFFFF"/>

  <!-- 折角 -->
  <path d="M 23 7 V 12 H 28 Z" fill="#9BA9E8"/>

  <!-- 三行文字胶囊 -->
  <rect x="13" y="15" width="6" height="1.6" rx="0.8" fill="#AAB2D8"/>
  <rect x="13" y="18.5" width="10" height="1.6" rx="0.8" fill="#AAB2D8"/>
  <rect x="13" y="22" width="5" height="1.6" rx="0.8" fill="#AAB2D8"/>

  <!-- Git 菱形徽章阴影 -->
  <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#5B6BA8" opacity="0.22" transform="translate(13.8 28) rotate(45)"/>

  <!-- Git 菱形徽章 -->
  <g transform="translate(13 27)">
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="url(#cw-git)" transform="rotate(45)"/>
    <!-- 主分支线（垂直） -->
    <line x1="-1.5" y1="2" x2="-1.5" y2="-2" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    <!-- 分支曲线（top -> bottom-right） -->
    <path d="M -1.5 -2 Q 2 -2 2 2" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none"/>
    <!-- 三个节点 -->
    <circle cx="-1.5" cy="2" r="1" fill="#FFFFFF"/>
    <circle cx="-1.5" cy="-2" r="1" fill="#FFFFFF"/>
    <circle cx="2" cy="2" r="1" fill="#FFFFFF"/>
  </g>
</svg>
