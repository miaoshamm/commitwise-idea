# Plugin metadata
pluginVersion=0.5.0
pluginSinceBuild=243
# 留空表示不限制上限版本（配合 patchPluginXml 直到最新）
pluginUntilBuild=

# IntelliJ Platform 编译 SDK 版本（发布构建用远程分发包）
# 本地开发若网络受限：设 useLocalIde=true 并填 localIdePath，跳过 ~1GB 下载
useLocalIde=true
localIdePath=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.0.1
platformVersion=2024.3

# Kotlin
kotlin.stdlib.default.dependency=true

# Gradle
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
# 禁用配置缓存：IntelliJ Platform Gradle Plugin 2.19.0 的 PrepareSandboxTask 中
# TransformBackedProvider 无法被 Gradle 9.1.0 序列化，导致 cache entry 丢弃并
# 引发 intellijPlatformTestSandboxRuntimeClasspath 依赖解析中断（junit4 在 Maven
# Central 列表中却报告 Could not find）。等插件升级支持后再启用。
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.jetbrains.intellij.platform.selfUpdateCheck=false
